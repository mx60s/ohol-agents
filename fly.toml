# Fly.io config for the always-on Artificial Selection world.
# One machine runs both processes (deploy/start.sh): the OHOL game server on
# 127.0.0.1:8005 and the agents service (viewer at /, API at /api) on :8787.
# See deploy/README.md for the commands, secrets and costs.
#
# Secrets (fly secrets set, never in this file):
#   OPENROUTER_API_KEY   narrator, story, director (Jev); also the agents' key when LLM_BASE_URL is unset
#   LLM_BASE_URL         the agents' endpoint, e.g. https://<pod>-8000.proxy.runpod.net/v1 (unset = OpenRouter)
#   LLM_API_KEY          the agents' endpoint key (the vLLM --api-key)
#   CONTROL_TOKEN        password for POST /api/start and /api/halt

app = "artificial-selection"
primary_region = "sjc"
# start.sh traps SIGTERM: agents stop first (research snapshot), then the
# game server quits gracefully. Leave time for both before the hard kill.
# SIGUSR1 restarts only the agents service (deploy/hot-update.sh).
kill_signal = "SIGTERM"
kill_timeout = "60s"

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  # always-on: no generation/lives/runtime limits, run starts at boot
  CONTINUOUS = "1"
  # the game server saves living characters (mtsPlayerSaves), so a server restart keeps the run and agents log back in
  RESUME_ACROSS_SERVER_RESTART = "1"
  AUTOSTART = "1"
  # start/stop from the dashboard needs CONTROL_TOKEN
  OPEN_CONTROL = "0"
  # few starting camps that grow by births: 2 Eves, 28 slots (one H200's comfortable load); a free slot waits to be born to a
  # mother (no forced Eves); a new Eve appears only when no woman alive can have a baby
  # TEST RUN (Sonnet 5.5, tester mode): 2 Eves side by side, 6 more slots born as their children
  # (up to 3 each) before any new Eve
  AGENT_COUNT = "8"
  INITIAL_EVES = "2"
  FAMILY_ROOM_MAX_HOLD_S = "0"
  # early birth cap (server mtsEarlyMaxBabies/mtsEarlyMaxGenerations, mirrored here so free slots wait
  # for a mother who can still have a baby): at most 3 babies per woman in generations 1-5
  EARLY_MAX_BABIES = "3"
  EARLY_MAX_GENERATIONS = "5"
  # after a login unexpectedly comes out as an Eve, joins wait this long (no Eve floods)
  EVE_MIN_GAP_S = "300"
  # new-player prompt: controls and our rules only, no recipes or strategy (agents/src/agent/prompt.ts)
  PROMPT_BASELINE = "new"
  # agents: self-hosted Qwen3-32B-FP8 + EAGLE-3 on one RunPod H200 (MODEL=q3 deploy/gpu/launch-qwen.sh; GPUS=2 for more agents;
  # docs/research/selfhost-optimize.md). LLM_BASE_URL and LLM_API_KEY are secrets (pod URL changes per pod).
  # Narrator, story and director stay on OpenRouter (OPENROUTER_API_KEY): Gemini 3.1 Flash-Lite and Jev.
  LLM_MODEL = "anthropic/claude-sonnet-5.5"
  LLM_REASONING_EFFORT = "low"
  # mild reasoning: thinking on, 400-token thinking budget inside 800 tokens (vLLM thinking_token_budget;
  # 400 removes Qwen3-32B's ~1% empty replies at 300, docs/research/selfhost-optimize.md)
  # OpenRouter: 0 = reasoning effort "low" (no token budget); room for thinking + the JSON reply
  LLM_REASONING_MAX_TOKENS = "0"
  LLM_DECISION_MAX_TOKENS = "4000"
  # tester mode (agents/src/agent/tester.ts): one ordered task list per family; issues -> issues.jsonl
  TESTER_GOALS = '["make fire, then a kiln, then a clay bowl, then fill the bowl with water, then build adobe walls with a door and a floor", "grow carrots and beans from seed to harvest, then make clothing, then keep sheep"]'
  RUN_LABEL = "TEST · Claude Sonnet 5.5 (low effort)"
  # hard stop for the test: the run halts past MAX_COST_USD; DAILY_COST_USD also survives restarts
  MAX_COST_USD = "550"
  # turn-based clock (docs/turn-clock.md): the world is frozen while everyone thinks, then runs
  # TURN_GAME_S of game time per turn (2.4 s: a year is 25 turns). Server and agents read TURN_CLOCK.
  TURN_CLOCK = "1"
  TURN_GAME_S = "2.4"
  TURN_DECIDE_TIMEOUT_S = "40"
  # no slowdown needed with turns: act windows run at normal game speed
  TIME_SCALE = "1"
  # the craft macro (recipe planner) is off with the new-player prompt
  CRAFT_MACRO = "0"
  MEMORY_MODE = "per-life"
  RECIPE_HINTS = "1"
  # actions per reply, back to back: 4 fits the ember chain (drill, swap, leaf, tinder) in one list
  ACTION_LIST_MAX = "4"
  NARRATOR_INTERVAL_MS = "300000"
  # no narration 23:00-10:00 Pacific
  NARRATOR_QUIET_HOURS = "23-10"
  NARRATOR_QUIET_TZ = "America/Los_Angeles"
  # stream director + "story so far" (defaults from .env.example)
  DIRECTOR_ENGINE = "jev"
  DIRECTOR_INTERVAL_MS = "10000"
  DIRECTOR_MIN_DWELL_MS = "30000"
  DIRECTOR_DEATH_HOLD_MS = "8000"
  DIRECTOR_CUTAWAY_MS = "10000"
  DIRECTOR_CUTAWAY_MIN_GAP_MS = "30000"
  DIRECTOR_CUTAWAY_MIN_SCORE = "7"
  DIRECTOR_CUTAWAY_HEURISTIC_SCORE = "9"
  DIRECTOR_CUTAWAY_P = "0.7"
  STORY_INTERVAL_MS = "0"
  # field notes on the home page (FIELD_NOTES_MODEL defaults to the story model)
  FIELD_NOTES_INTERVAL_MS = "1200000"
  FIELD_NOTES_MODEL = "anthropic/claude-sonnet-5.5"
  # spend guards: 0 = off. Set e.g. DAILY_COST_USD = "5" to pause LLM calls
  # once the rolling 24h spend reaches it (survives restarts, kept in LOG_DIR).
  DAILY_COST_USD = "550"
  MAX_TOTAL_COST_USD = "0"
  # paths on the volume (start.sh defaults, spelled out for clarity)
  DATA_DIR = "/data"
  LOG_DIR = "/data/logs"
  PORT = "8787"

[[mounts]]
  source = "as_data"
  destination = "/data"
  initial_size = "3gb"
  snapshot_retention = 7
  # grow the volume instead of filling it (game logs + research data only grow)
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "10GB"

[http_service]
  internal_port = 8787
  force_https = true
  # the world must keep running with nobody watching
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    # SSE clients (/api/stream) hold a connection each
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

  [[http_service.checks]]
    grace_period = "60s"
    interval = "60s"
    timeout = "10s"
    method = "GET"
    path = "/api/state"

# start.sh restarts a crashed agents service itself (the world stays up) and
# exits non-zero only if the game server dies; then bring the machine back
[[restart]]
  policy = "always"

[[vm]]
  # up to 40 agents + the game server: 2 dedicated CPUs
  size = "performance-2x"
  memory = "4gb"
